[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzi-skeleton"
version = "0.1.0"
description = "Geometric skeleton extraction and graph analysis for Chinese inscription rubbings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "pillow==13.0.0",
  "scipy==1.18.1",
  "scikit-image==0.26.0",
  "networkx==3.7",
  "sknw==0.15",
]

[project.scripts]
hanzi-skeleton = "hanzi_skeleton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
